appId: com.mytodo.desktop
productName: DOOK
directories:
  output: release
files:
  - out/**/*
  - package.json
asar: true
npmRebuild: false
extraResources:
  - from: resources/app-icon.png
    to: resources/app-icon.png
win:
  icon: resources/app-icon.ico
  target:
    - target: nsis
      arch: [x64]
  artifactName: DOOK-${version}-setup.${ext}
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  deleteAppDataOnUninstall: false
