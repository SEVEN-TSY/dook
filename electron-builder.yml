appId: com.dook.desktop
productName: DOOK
directories:
  output: release
files:
  - out/**/*
  - package.json
asar: true
npmRebuild: false
extraResources:
  - from: resources/app-icon.png
    to: resources/app-icon.png
  - from: LICENSE
    to: LICENSE
  - from: src/renderer/src/components/ui/LICENSE.md
    to: licenses/shadcn-MIT.md
win:
  icon: resources/app-icon.ico
  target:
    - target: nsis
      arch: [x64]
  artifactName: dook-${version}-setup.${ext}
nsis:
  # 沿用electron-builder根据旧appId com.mytodo.desktop生成的安装标识。
  guid: 90c646f5-435d-5609-9531-7294291184e5
  include: resources/installer.nsh
  oneClick: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  deleteAppDataOnUninstall: false
