appId: com.mytodo.desktop
productName: myTodo
directories:
  output: release
files:
  - out/**/*
  - package.json
asar: true
npmRebuild: false
win:
  target:
    - target: nsis
      arch: [x64]
  artifactName: myTodo-${version}-setup.${ext}
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  deleteAppDataOnUninstall: false
